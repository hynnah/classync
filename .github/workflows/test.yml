name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: classync
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply schema
        run: node server/src/db/migrate.js
        env:
          DATABASE_URL: mysql://root:@127.0.0.1:3306/classync

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:@127.0.0.1:3306/classync
          SESSION_SECRET: ci-test-secret